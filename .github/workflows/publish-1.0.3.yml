name: Publish ProjektZeit 1.0.3

on:
  pull_request:
    branches: [main]
    paths:
      - ".release-trigger-public-1.0.3"

permissions:
  contents: write

jobs:
  publish:
    if: github.head_ref == 'publish-1.0.3'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download verified 1.0.3 installer artifact
        shell: bash
        env:
          INSTALLER_ARCHIVE_URL: "https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-4420-8210-a71f-506fae0a82fb/raw?se=2026-09-19T00%3A40%3A35Z&sp=r&sv=2026-02-06&sr=b&scid=6492e8e5-842d-5606-9c11-8056d5e0fa0d&skoid=d294dba5-36f7-432b-aab8-935656489847&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-18T19%3A24%3A27Z&ske=2026-09-19T19%3A24%3A27Z&sks=b&skv=2026-02-06&sig=vom8bBnVKszo8BZN2XOnLLPrxQ%2B82jyb%2BZ0EaLnXDhA%3D"
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 "$INSTALLER_ARCHIVE_URL" -o installer-1.0.3.zip
          unzip -o installer-1.0.3.zip
          test -f ProjektZeit-Setup-1.0.3.exe

      - name: Prepare public 1.0.3 distribution
        shell: bash
        run: |
          set -euo pipefail
          rm -f ProjektZeit-Setup-1.0.0.exe ProjektZeit-Setup-1.0.1.exe ProjektZeit-Setup-1.0.2.exe installer.zip installer-1.0.2.zip installer-1.0.3.zip
          cat > version.json <<'JSON'
          {
            "product": "ProjektZeit",
            "release": "1.0.3",
            "server": "1.0.3",
            "windowsClient": "1.0.3",
            "published": "2026-09-19"
          }
          JSON
          cat > compatibility.json <<'JSON'
          {
            "schemaVersion": 1,
            "serverVersion": "1.0.3",
            "windowsClient": {
              "recommended": "1.0.3",
              "minimum": "1.0.3",
              "maximum": "1.0.x",
              "download": "https://github.com/tojollinor/ProjektZeit/releases/download/v1.0.3/ProjektZeit-Setup-1.0.3.exe"
            }
          }
          JSON
          sed -i 's/^PROJEKTZEIT_VERSION=.*/PROJEKTZEIT_VERSION=1.0.3/' .env.example
          python - <<'PY'
          from pathlib import Path
          path = Path("CHANGELOG.md")
          text = path.read_text(encoding="utf-8")
          heading = "## ProjektZeit 1.0.3 — 2026-09-19"
          if heading not in text:
              entry = """## ProjektZeit 1.0.3 — 2026-09-19

          - Added full calendar event creation, editing, invitations, responses and company-wide events.
          - Added flexible statistics workbench with scoped date-range analysis and saved views.
          - Added external evidence synchronization and review for Zammad, STARFACE and TeamViewer.
          - Added customer, project and order mapping for external evidence.
          - Added structured audit/security logs and extended operational diagnostics.

          """
              text = text.replace("# Changelog\n", "# Changelog\n\n" + entry, 1)
              path.write_text(text, encoding="utf-8")
          PY
          sha256sum ProjektZeit-Setup-1.0.3.exe > SHA256SUMS.txt
          if find . -path './.git' -prune -o -type f \( -name '*.map' -o -name '*.py' -o -name '*.ts' -o -name '*.tsx' -o -name '*.cs' \) -print | grep -q .; then
            echo "Application source or source maps detected in public distribution." >&2
            exit 1
          fi

      - name: Commit public distribution
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ProjektZeit Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Release 1.0.3"
            git push origin HEAD:main
          fi

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.0.3 --repo tojollinor/ProjektZeit >/dev/null 2>&1; then
            gh release upload v1.0.3 ProjektZeit-Setup-1.0.3.exe SHA256SUMS.txt --repo tojollinor/ProjektZeit --clobber
          else
            gh release create v1.0.3 ProjektZeit-Setup-1.0.3.exe SHA256SUMS.txt               --repo tojollinor/ProjektZeit               --title "ProjektZeit 1.0.3"               --notes "ProjektZeit 1.0.3. Masterplan Block 4/5: Kalender, Statistiken, Nachweise und Diagnose."
          fi
