name: Finalize ProjektZeit 1.0.5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-1.0.5-temp.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    env:
      INSTALLER_ARTIFACT_URL: "https://sdmntprnortheu.oaiusercontent.com/files/00000000-e684-81f4-a2e8-c15021a0379b/raw?se=2026-09-23T08%3A29%3A41Z&sp=r&sv=2026-02-06&sr=b&scid=825a5fd1-d364-50ac-92ce-7bdec26dcffd&skoid=002823aa-689d-47ca-9347-108c20f4f00d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-23T07%3A53%3A54Z&ske=2026-09-24T07%3A53%3A54Z&sks=b&skv=2026-02-06&sig=o5iX74406e1Z9hyWhr8Td37EbV3jPo8xC4UbrdfZflc%3D"
      VERSION: "1.0.5"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download final installer artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -fL "$INSTALLER_ARTIFACT_URL" -o /tmp/installer.zip
          mkdir -p /tmp/installer
          unzip -q /tmp/installer.zip -d /tmp/installer
          installer="$(find /tmp/installer -type f -name 'ProjektZeit-Setup-*.exe' -print -quit)"
          test -n "$installer"
          cp "$installer" "ProjektZeit-Setup-${VERSION}.exe"
          sha256sum "ProjektZeit-Setup-${VERSION}.exe" > SHA256SUMS.txt

      - name: Commit final public distribution
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/finalize-1.0.5-temp.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "ProjektZeit Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Finalize ProjektZeit ${VERSION}"
          git push origin HEAD:main

      - name: Retarget release tag
        shell: bash
        run: |
          set -euo pipefail
          git tag -f "v${VERSION}"
          git push origin "refs/tags/v${VERSION}" --force

      - name: Update GitHub release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "v${VERSION}" "ProjektZeit-Setup-${VERSION}.exe" SHA256SUMS.txt --clobber
          gh release edit "v${VERSION}" --title "ProjektZeit ${VERSION}" --notes "ProjektZeit ${VERSION}. Finaler Release-Stand vom 23.09.2026. Installation und Prüfsumme; der Anwendungsquellcode bleibt im privaten Source-Repository."
