name: Rebuild ProjektZeit 1.0.5 release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-1.0.5-release-temp.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    env:
      VERSION: "1.0.5"
      EXPECTED_SHA256: "385800c685effa099bafcf433a94c347786eed5a9682dcb4eb78bc1b4e847876"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify final installer
        shell: bash
        run: |
          set -euo pipefail
          echo "${EXPECTED_SHA256}  ProjektZeit-Setup-${VERSION}.exe" | sha256sum -c -
          grep -F "${EXPECTED_SHA256}  ProjektZeit-Setup-${VERSION}.exe" SHA256SUMS.txt

      - name: Remove temporary workflow and finalize tag target
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/rebuild-1.0.5-release-temp.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "ProjektZeit Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Finalize ProjektZeit ${VERSION} release metadata"
          git push origin HEAD:main
          git tag -f "v${VERSION}"
          git push origin "refs/tags/v${VERSION}" --force

      - name: Recreate GitHub release with final assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete "v${VERSION}" --yes || true
          gh release create "v${VERSION}" \
            "ProjektZeit-Setup-${VERSION}.exe" SHA256SUMS.txt \
            --title "ProjektZeit ${VERSION}" \
            --notes "ProjektZeit ${VERSION}. Finaler Release-Stand vom 23.09.2026. Installation und Prüfsumme; der Anwendungsquellcode bleibt im privaten Source-Repository."
