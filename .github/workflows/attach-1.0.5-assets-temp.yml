name: Attach ProjektZeit 1.0.5 assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/attach-1.0.5-assets-temp.yml'

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    env:
      VERSION: "1.0.5"
      EXPECTED_SHA256: "385800c685effa099bafcf433a94c347786eed5a9682dcb4eb78bc1b4e847876"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify final installer
        shell: bash
        run: |
          set -euo pipefail
          echo "${EXPECTED_SHA256}  ProjektZeit-Setup-${VERSION}.exe" | sha256sum -c -
          grep -F "${EXPECTED_SHA256}  ProjektZeit-Setup-${VERSION}.exe" SHA256SUMS.txt

      - name: Remove temporary workflow and keep tag clean
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/attach-1.0.5-assets-temp.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "ProjektZeit Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Finalize ProjektZeit ${VERSION} release assets"
          git push origin HEAD:main
          git tag -f "v${VERSION}"
          git push origin "refs/tags/v${VERSION}" --force

      - name: Attach final assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "v${VERSION}" \
            "ProjektZeit-Setup-${VERSION}.exe" SHA256SUMS.txt
          gh release view "v${VERSION}" --json assets --jq '.assets[] | [.name,.size,.digest] | @tsv'
