name: Publish ProjektZeit 1.0.4

on:
  pull_request:
    branches: [main]
    paths:
      - ".release-trigger-public-1.0.4"

permissions:
  contents: write

jobs:
  publish:
    if: github.head_ref == 'publish-1.0.4'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download verified 1.0.4 installer artifact
        shell: bash
        env:
          INSTALLER_ARCHIVE_URL: "https://sdmntprnortheu.oaiusercontent.com/files/00000000-fb9c-81f4-a25d-e58ca8c28c36/raw?se=2026-09-19T01%3A42%3A13Z&sp=r&sv=2026-02-06&sr=b&scid=eccb1624-cc57-5ea9-9a32-5eec2dafc908&skoid=002823aa-689d-47ca-9347-108c20f4f00d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-18T19%3A24%3A32Z&ske=2026-09-19T19%3A24%3A32Z&sks=b&skv=2026-02-06&sig=mBwRH1y9I%2BBKvAXmrG1NH4PfpEawzCRo58835eLfnjI%3D"
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 "$INSTALLER_ARCHIVE_URL" -o installer-1.0.4.zip
          unzip -o installer-1.0.4.zip
          test -f ProjektZeit-Setup-1.0.4.exe

      - name: Prepare public 1.0.4 distribution
        shell: bash
        run: |
          set -euo pipefail
          rm -f ProjektZeit-Setup-1.0.0.exe ProjektZeit-Setup-1.0.1.exe ProjektZeit-Setup-1.0.2.exe ProjektZeit-Setup-1.0.3.exe
          rm -f installer.zip installer-1.0.1.zip installer-1.0.2.zip installer-1.0.3.zip installer-1.0.4.zip
          cat > version.json <<'JSON'
          {
            "product": "ProjektZeit",
            "release": "1.0.4",
            "server": "1.0.4",
            "windowsClient": "1.0.4",
            "published": "2026-09-19"
          }
          JSON
          cat > compatibility.json <<'JSON'
          {
            "schemaVersion": 1,
            "serverVersion": "1.0.4",
            "windowsClient": {
              "recommended": "1.0.4",
              "minimum": "1.0.4",
              "maximum": "1.0.x",
              "download": "https://github.com/tojollinor/ProjektZeit/releases/download/v1.0.4/ProjektZeit-Setup-1.0.4.exe"
            }
          }
          JSON
          sed -i 's/^PROJEKTZEIT_VERSION=.*/PROJEKTZEIT_VERSION=1.0.4/' .env.example
          python - <<'PY'
          from pathlib import Path
          path = Path("CHANGELOG.md")
          text = path.read_text(encoding="utf-8")
          heading = "## ProjektZeit 1.0.4 — 2026-09-19"
          if heading not in text:
              entry = """## ProjektZeit 1.0.4 — 2026-09-19

          - Completed the Greenfield master-plan acceptance pass and added a persistent master-plan status checklist.
          - Added Dienstreisen with travel periods, overnight stays and provided meals.
          - Added real notification delivery for SMTP e-mail, browser Web Push and Pushover.
          - Added personal and company Pushover configuration, browser push registration and channel preferences.
          - Completed account security settings for passkeys, TOTP, recovery codes and session revocation.
          - Completed editable company, work-time, SMTP, time-category and absence-type settings.
          - Hardened production startup, trusted hosts, security headers and readiness diagnostics.
          - Added automatic Alembic upgrades at container startup and upgrade grants for existing bookkeeping roles.
          - Expanded the Windows client with order stop, notifications, tray alerts and update checks.
          - Added server permission auditing and full Docker-based Chromium E2E coverage for desktop and mobile.

          """
              text = text.replace("# Changelog\n", "# Changelog\n\n" + entry, 1)
              path.write_text(text, encoding="utf-8")
          PY
          sha256sum ProjektZeit-Setup-1.0.4.exe > SHA256SUMS.txt
          if find . -path './.git' -prune -o -type f \( -name '*.map' -o -name '*.py' -o -name '*.ts' -o -name '*.tsx' -o -name '*.cs' \) -print | grep -q .; then
            echo "Application source or source maps detected in public distribution." >&2
            exit 1
          fi

      - name: Commit public distribution
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ProjektZeit Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Release 1.0.4"
            git push origin HEAD:main
          fi

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.0.4 --repo tojollinor/ProjektZeit >/dev/null 2>&1; then
            gh release upload v1.0.4 ProjektZeit-Setup-1.0.4.exe SHA256SUMS.txt --repo tojollinor/ProjektZeit --clobber
          else
            gh release create v1.0.4 ProjektZeit-Setup-1.0.4.exe SHA256SUMS.txt \
              --repo tojollinor/ProjektZeit \
              --title "ProjektZeit 1.0.4" \
              --notes "ProjektZeit 1.0.4. Abschluss Block 5/5: Security, E2E und Masterplan-Abnahme."
          fi
