name: Publish ProjektZeit 1.0.0
on:
  push:
    paths:
      - ".release/publish-v1.0.0"
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      DIST_URL: "https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-b910-8210-9d0f-1679f73f73d5/raw?se=2026-09-18T16%3A13%3A40Z&sp=r&sv=2026-02-06&sr=b&scid=936fe18a-6dac-5a9b-9dff-909493330a9e&skoid=d294dba5-36f7-432b-aab8-935656489847&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-18T13%3A36%3A13Z&ske=2026-09-19T13%3A36%3A13Z&sks=b&skv=2026-02-06&sig=FG2O3C6/mTcFklFWKY8C9GsAqPtzV8%2B1yXT6u%2BO0KYA%3D"
    steps:
      - uses: actions/checkout@v4
      - name: Download verified public release package
        shell: bash
        run: |
          curl --fail --location "$DIST_URL" --output /tmp/projektzeit-public.zip
          mkdir /tmp/projektzeit-public
          unzip -q /tmp/projektzeit-public.zip -d /tmp/projektzeit-public
          cd /tmp/projektzeit-public
          sha256sum -c SHA256SUMS.txt
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd /tmp/projektzeit-public
          gh release create v1.0.0 ProjektZeit-Setup-1.0.0.exe SHA256SUMS.txt             --repo tojollinor/ProjektZeit             --title "ProjektZeit 1.0.0"             --notes-file CHANGELOG.md
