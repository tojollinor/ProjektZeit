name: Publish ProjektZeit 1.0.5

on:
  push:
    branches: [main]
    paths:
      - ".release-trigger-public-1.0.5"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download verified 1.0.5 installer artifact
        shell: bash
        env:
          INSTALLER_ARCHIVE_URL: "https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-7ca4-8210-9189-b6d7d7154cfa/raw?se=2026-09-19T05%3A11%3A44Z&sp=r&sv=2026-02-06&sr=b&scid=709bc790-2e3e-50cd-94b8-833d1e21614d&skoid=002823aa-689d-47ca-9347-108c20f4f00d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-18T20%3A17%3A54Z&ske=2026-09-19T20%3A17%3A54Z&sks=b&skv=2026-02-06&sig=7DWFJq65SWdw7zyRTlsxYLYGfvRzw4f6wqSu9zt1bBI%3D"
        run: |
          set -euo pipefail
          rm -f ProjektZeit-Setup-*.exe
          curl -L --fail --retry 3 "$INSTALLER_ARCHIVE_URL" -o installer-1.0.5.zip
          unzip -o installer-1.0.5.zip
          rm -f installer-1.0.5.zip
          test -f ProjektZeit-Setup-1.0.5.exe

      - name: Prepare public 1.0.5 distribution
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          files = json.loads(r'''{\"CHANGELOG.md\":\"# Changelog\\n\\n## ProjektZeit 1.0.5 — 2026-09-19\\n\\n- Reconciled the Greenfield build against pre-reset product requirements and restored missing workflows.\\n- Replaced native browser prompts and Windows MessageBox flows with consistent ProjektZeit-owned dialogs and added regression guards.\\n- Restored direct work-time corrections with pauses, audit history and billed-time protection.\\n- Added linked payroll reversal entries and explicit project billing handoff/reopen workflows.\\n- Restored profile editing, avatar, theme selection, holiday-region defaults, API tokens and CSV import/export.\\n- Restored admin MFA reset UI, individual permission overrides, optional first-password change and policy-controlled remember-me login.\\n- Restored customer/project history, evidence-to-customer suggestions, Zammad owner filters, provider column settings and TeamViewer token help.\\n- Restored grouped STARFACE missed calls with persistent callback status and compact notification indicators.\\n- Restored a responsive month calendar and expanded regression coverage for the reconciled workflows.\\n\\n\\n## ProjektZeit 1.0.4 — 2026-09-19\\n\\n- Completed the Greenfield master-plan acceptance pass and added a persistent master-plan status checklist.\\n- Added Dienstreisen with travel periods, overnight stays and provided meals.\\n- Added real notification delivery for SMTP e-mail, browser Web Push and Pushover.\\n- Added personal and company Pushover configuration, browser push registration and channel preferences.\\n- Completed account security settings for passkeys, TOTP, recovery codes and session revocation.\\n- Completed editable company, work-time, SMTP, time-category and absence-type settings.\\n- Hardened production startup, trusted hosts, security headers and readiness diagnostics.\\n- Added automatic Alembic upgrades at container startup and upgrade grants for existing bookkeeping roles.\\n- Expanded the Windows client with order stop, notifications, tray alerts and update checks.\\n- Added server permission auditing and full Docker-based Chromium E2E coverage for desktop and mobile.\\n\\n\\n## ProjektZeit 1.0.3 — 2026-09-19\\n\\n- Added full calendar event creation, editing, invitations, responses and company-wide events.\\n- Added flexible statistics workbench with scoped date-range analysis and saved views.\\n- Added external evidence synchronization and review for Zammad, STARFACE and TeamViewer.\\n- Added customer, project and order mapping for external evidence.\\n- Added structured audit/security logs and extended operational diagnostics.\\n- Added responsive web workbenches and regression tests for the new workflows.\\n\\n\\n## ProjektZeit 1.0.2 — 2026-09-19\\n\\n- Completed employee master-data views with work models and contact visibility.\\n- Added full administrator user management including role assignment, activation and password reset.\\n- Added editable role and permission management in the web interface.\\n- Added customer detail editing, archiving and customer contacts including Zammad and TeamViewer mappings.\\n- Added project detail editing, lifecycle controls and project-member management.\\n- Added server-side permission checks and regression tests for the new master-data workflows.\\n\\n\\n## ProjektZeit 1.0.1 — 2026-09-19\\n\\n- Completed absence workflows including approval, cancellation and hour-ledger synchronization.\\n- Added on-call rotations, slots and replacement workflows.\\n- Added notification management, attachment/receipt workflows and company branding.\\n- Completed billing approval, rejection, resubmission, finalization and correction states.\\n- Added real provider clients and settings for Zammad, STARFACE and TeamViewer.\\n- Hardened permissions, calendar visibility and release/version handling.\\n- Added source-free public release publication with installer checksums.\\n\\n\\n## ProjektZeit Server 1.0.0 — 2026-09-18\\n\\n- First Greenfield release with a new relational data model and audit history.\\n- Customers, employees, projects, orders, work time, absences, expenses and billing domains.\\n- Role-based permissions with per-user exceptions.\\n- PWA, responsive web application, notifications, calendar/iCal, diagnostics and integration account model.\\n- New setup wizard and full demo-data workflow.\\n\\n## ProjektZeit Windows 1.0.0 — 2026-09-18\\n\\n- New tray client with browser authorization using Authorization Code + PKCE.\\n- New regular Windows installer with server and compatibility checks before installation.\\n- Server URL is preserved for upgrades.\\n\",\"compatibility.json\":\"{\\n  \\\"schemaVersion\\\": 1,\\n  \\\"serverVersion\\\": \\\"1.0.5\\\",\\n  \\\"windowsClient\\\": {\\n    \\\"recommended\\\": \\\"1.0.5\\\",\\n    \\\"minimum\\\": \\\"1.0.5\\\",\\n    \\\"maximum\\\": \\\"1.0.x\\\",\\n    \\\"download\\\": \\\"https://github.com/tojollinor/ProjektZeit/releases/download/v1.0.5/ProjektZeit-Setup-1.0.5.exe\\\"\\n  }\\n}\\n\",\"version.json\":\"{\\n  \\\"product\\\": \\\"ProjektZeit\\\",\\n  \\\"release\\\": \\\"1.0.5\\\",\\n  \\\"server\\\": \\\"1.0.5\\\",\\n  \\\"windowsClient\\\": \\\"1.0.5\\\",\\n  \\\"published\\\": \\\"2026-09-19\\\"\\n}\\n\",\"docker-compose.yml\":\"services:\\n  db:\\n    image: postgres:17-alpine\\n    container_name: projektzeit-db\\n    restart: unless-stopped\\n    environment:\\n      POSTGRES_DB: ${DB_NAME}\\n      POSTGRES_USER: ${DB_USER}\\n      POSTGRES_PASSWORD: ${DB_PASSWORD}\\n    volumes:\\n      - projektzeit-db:/var/lib/postgresql/data\\n    healthcheck:\\n      test: [\\\"CMD-SHELL\\\", \\\"pg_isready -U ${DB_USER} -d ${DB_NAME}\\\"]\\n      interval: 10s\\n      timeout: 5s\\n      retries: 10\\n\\n  projektzeit:\\n    image: ghcr.io/tojollinor/projektzeit:${PROJEKTZEIT_VERSION:-latest}\\n    container_name: projektzeit\\n    restart: unless-stopped\\n    ports:\\n      - \\\"${APP_PORT:-8080}:8080\\\"\\n    environment:\\n      APP_URL: ${APP_URL}\\n      APP_SECRET_KEY: ${APP_SECRET_KEY}\\n      PROJEKTZEIT_VERSION: ${PROJEKTZEIT_VERSION}\\n      DATABASE_URL: postgresql+psycopg://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}\\n      STORAGE_PATH: /data/files\\n      BOOTSTRAP_ADMIN_FIRST_NAME: ${BOOTSTRAP_ADMIN_FIRST_NAME}\\n      BOOTSTRAP_ADMIN_LAST_NAME: ${BOOTSTRAP_ADMIN_LAST_NAME}\\n      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL}\\n      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD}\\n    depends_on:\\n      db:\\n        condition: service_healthy\\n    volumes:\\n      - projektzeit-files:/data/files\\n\\nvolumes:\\n  projektzeit-db:\\n  projektzeit-files:\\n\",\".env.example\":\"# Public URL used by browsers, emails and the Windows client.\\nAPP_URL=https://projektzeit.example.de\\n\\n# Host port for the ProjektZeit container.\\nAPP_PORT=8080\\n\\n# Long random secret used to protect server-side secrets and sessions.\\nAPP_SECRET_KEY=replace-with-a-long-random-value\\n\\n# PostgreSQL database name.\\nDB_NAME=projektzeit\\n\\n# PostgreSQL database user.\\nDB_USER=projektzeit\\n\\n# PostgreSQL database password.\\nDB_PASSWORD=change-me\\n\\n# First name of the initial administrator. Used only when the database is empty.\\nBOOTSTRAP_ADMIN_FIRST_NAME=Tobias\\n\\n# Last name of the initial administrator.\\nBOOTSTRAP_ADMIN_LAST_NAME=Friedrichsen\\n\\n# Login email of the initial administrator.\\nBOOTSTRAP_ADMIN_EMAIL=admin@example.de\\n\\n# Initial administrator password. Change it after the first login and remove it from the environment afterwards.\\nBOOTSTRAP_ADMIN_PASSWORD=change-this-before-start\\n\\n# Image tag to deploy. Use a fixed release tag in production instead of latest.\\nPROJEKTZEIT_VERSION=1.0.5\\n\"}''')
          for name, content in files.items():
              Path(name).write_text(content, encoding="utf-8")
          PY
          sha256sum ProjektZeit-Setup-1.0.5.exe > SHA256SUMS.txt
          if find . -path './.git' -prune -o -type f \( -name '*.map' -o -name '*.py' -o -name '*.ts' -o -name '*.tsx' -o -name '*.cs' \) -print | grep -q .; then
            echo "Application source or source maps detected in public distribution." >&2
            exit 1
          fi

      - name: Commit public distribution
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ProjektZeit Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Release 1.0.5"
            git push origin HEAD:main
          fi

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.0.5 --repo tojollinor/ProjektZeit >/dev/null 2>&1; then
            gh release upload v1.0.5 ProjektZeit-Setup-1.0.5.exe SHA256SUMS.txt --repo tojollinor/ProjektZeit --clobber
          else
            gh release create v1.0.5 ProjektZeit-Setup-1.0.5.exe SHA256SUMS.txt \
              --repo tojollinor/ProjektZeit \
              --title "ProjektZeit 1.0.5" \
              --notes "ProjektZeit 1.0.5. Masterplan-Reconciliation, eigene Dialoge, wiederhergestellte Workflows und finale Release-Korrekturen."
          fi
